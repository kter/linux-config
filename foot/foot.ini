[key-bindings]
# Super+A (Toshy -> Ctrl+Shift+A): foot has no select-all, so copy the whole scrollback
pipe-scrollback=[wl-copy] Control+Shift+a

# Allow font zoom without relying on the Ctrl/Alt remapping.
font-increase=Control+plus Control+equal Control+KP_Add Shift+F12
font-decrease=Control+minus Control+KP_Subtract Shift+F11
font-reset=Control+0 Control+KP_0 Shift+F10
